name: Senate PTR Collector

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senate-ptr-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run parser and matcher tests
        run: npm test

      - name: Run Senate PTR collector
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
          SENATE_EFD_ACKNOWLEDGE_USE_RESTRICTIONS: "true"
          TRACKER_COLLECTOR_SOFT_FAIL_SOURCE_UNAVAILABLE: "true"
          TRACKER_SEARCH_LOOKBACK_DAYS: "45"
          TRACKER_SEARCH_PAGE_LENGTH: "25"
          TRACKER_MAX_IMPORTS_PER_RUN: "10"
        run: npm run collector:run -- --acknowledge-use-restrictions --soft-fail-source-unavailable

      - name: Upload raw Senate eFD archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senate-efd-raw-${{ github.run_id }}
          path: data/raw/senate-efd/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit processed tracker state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/disclosure-store.json data/processed/collector-state.json || true
          git diff --cached --quiet || git commit -m "chore: update Senate PTR tracker state"
          git push
